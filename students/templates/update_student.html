{% extends 'base.html' %}
{% block content %}
<div class="max-w-3xl mx-auto animate-fade-up">
    <div class="flex items-center gap-2 mb-6">
        <i data-lucide="pencil" class="w-6 h-6 text-yellow-600"></i>
        <h1 class="text-2xl font-bold text-slate-900">Update Student</h1>
    </div>

    <div class="bg-white rounded-2xl shadow-md border border-slate-100 p-6 sm:p-8">
        <form method="POST" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            {% csrf_token %}
            
            <div class="col-span-2 sm:col-span-1">
                <label class="block text-sm font-bold text-slate-700 mb-1.5">Full Name</label>
                <input type="text" name="name" value="{{ student.name }}" required 
                       class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition bg-slate-50 hover:bg-white">
            </div>

            <div class="col-span-2 sm:col-span-1">
                <label class="block text-sm font-bold text-slate-700 mb-1.5">Age</label>
                <input type="number" name="age" value="{{ student.age }}" required 
                       class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition bg-slate-50 hover:bg-white">
            </div>

            <div class="col-span-2 sm:col-span-1">
                <label class="block text-sm font-bold text-slate-700 mb-1.5">Gender</label>
                <select name="gender" required class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition bg-white">
                    <option value="Male" {% if student.gender == 'Male' %}selected{% endif %}>Male</option>
                    <option value="Female" {% if student.gender == 'Female' %}selected{% endif %}>Female</option>
                    <option value="Other" {% if student.gender == 'Other' %}selected{% endif %}>Other</option>
                </select>
            </div>

            <div class="col-span-2 sm:col-span-1">
                <label class="block text-sm font-bold text-slate-700 mb-1.5">Class</label>
                <input type="text" name="class_name" value="{{ student.class_name }}" required 
                       class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition bg-slate-50 hover:bg-white">
            </div>

            <div class="col-span-2 sm:col-span-1">
                <label class="block text-sm font-bold text-slate-700 mb-1.5">Phone</label>
                <input type="text" name="phone" value="{{ student.phone }}" required 
                       class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition bg-slate-50 hover:bg-white">
            </div>

            <div class="col-span-2 sm:col-span-1">
                <label class="block text-sm font-bold text-slate-700 mb-1.5">Email</label>
                <input type="email" name="email" value="{{ student.email }}" required 
                       class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition bg-slate-50 hover:bg-white">
            </div>

            <div class="md:col-span-2">
                <label class="block text-sm font-bold text-slate-700 mb-1.5">Address</label>
                <textarea name="address" rows="3" required class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition bg-slate-50 hover:bg-white">{{ student.address }}</textarea>
            </div>

            <div class="col-span-2 sm:col-span-1">
                <label class="block text-sm font-bold text-slate-700 mb-1.5">Admission Date</label>
                <input type="date" name="admission_date" value="{{ student.admission_date|date:'Y-m-d' }}" required 
                       class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition bg-slate-50 hover:bg-white">
            </div>

            <div class="flex items-end pt-2 col-span-2 sm:col-span-1 gap-4">
                <button type="submit" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3 px-4 rounded-xl shadow-md hover:shadow-lg transition-all duration-300 hover:scale-[1.02]">
                    Save Changes
                </button>
                <a href="{% url 'student_list' %}" class="w-full text-center bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 px-4 rounded-xl transition-all duration-300">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

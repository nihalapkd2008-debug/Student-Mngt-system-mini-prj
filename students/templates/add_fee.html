{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="animate-fade-up max-w-2xl mx-auto">

    <!-- Back Button -->
    <a href="{% url 'fee_list' %}" class="inline-flex items-center text-sm text-blue-600 hover:text-blue-800 mb-4 transition-colors">
        <i data-lucide="arrow-left" class="w-4 h-4 mr-1"></i> Back to Fees
    </a>

    <div class="premium-card p-6">
        <h2 class="text-2xl font-bold text-slate-900 mb-2 flex items-center gap-2">
            <i data-lucide="{% if fee %}pencil{% else %}plus{% endif %}" class="w-6 h-6 text-blue-600"></i>
            {% if fee %}Edit{% else %}Add{% endif %} Fee Record
        </h2>
        <p class="text-slate-500 text-sm mb-6">
            {% if fee %}Update fee details{% else %}Enter fee details for a student{% endif %}
        </p>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            
            <!-- Student -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Student</label>
                <select name="student" required class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 bg-white">
                    {% for student in students %}
                    <option value="{{ student.id }}" {% if fee and fee.student.id == student.id %}selected{% endif %}>
                        {{ student.name }} - {{ student.class_name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Amount -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Amount (₹)</label>
                <input type="number" name="amount" step="0.01" required 
                       value="{{ fee.amount|default:'' }}"
                       class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 bg-white">
            </div>

            <!-- Dates -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Fee Date</label>
                    <input type="date" name="fee_date" required 
                           value="{{ fee.fee_date|date:'Y-m-d'|default:'' }}"
                           class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 bg-white">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Due Date</label>
                    <input type="date" name="due_date" required 
                           value="{{ fee.due_date|date:'Y-m-d'|default:'' }}"
                           class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 bg-white">
                </div>
            </div>

            <!-- Status -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Status</label>
                <select name="status" required class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 bg-white">
                    <option value="Paid" {% if fee and fee.status == 'Paid' %}selected{% endif %}>✅ Paid</option>
                    <option value="Pending" {% if fee and fee.status == 'Pending' %}selected{% endif %}>⏳ Pending</option>
                    <option value="Overdue" {% if fee and fee.status == 'Overdue' %}selected{% endif %}>⚠️ Overdue</option>
                </select>
            </div>

            <!-- Description -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Description (Optional)</label>
                <input type="text" name="description" 
                       value="{{ fee.description|default:'' }}"
                       placeholder="e.g. Tuition fee for June" 
                       class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 bg-white">
            </div>

            <!-- Buttons -->
            <div class="flex gap-3 pt-4">
                <button type="submit" class="flex-1 px-6 py-2.5 bg-blue-700 text-white rounded-lg font-medium hover:bg-blue-800 transition shadow-md">
                    {% if fee %}Update{% else %}Add{% endif %} Fee Record
                </button>
                <a href="{% url 'fee_list' %}" class="px-6 py-2.5 bg-slate-200 text-slate-700 rounded-lg font-medium hover:bg-slate-300 transition text-center">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block content %}
<div class="max-w-3xl mx-auto animate-fade-in">
    <div class="flex items-center gap-2 mb-6">
        <div class="bg-gradient-to-br from-blue-500 to-indigo-600 p-2 rounded-lg shadow-lg shadow-blue-500/30">
            <svg class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
        </div>
        <h1 class="text-2xl font-extrabold text-slate-800">Add New Student</h1>
    </div>

    <div class="bg-white rounded-2xl shadow-xl border border-slate-100 p-6 sm:p-8">
        <form method="POST" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            {% csrf_token %}
            <div class="col-span-2 sm:col-span-1">
                <label class="block text-sm font-bold text-slate-700 mb-1.5">Full Name</label>
                <input type="text" name="name" required class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition bg-slate-50 hover:bg-white">
            </div>
            <div class="col-span-2 sm:col-span-1">
                <label class="block text-sm font-bold text-slate-700 mb-1.5">Age</label>
                <input type="number" name="age" required class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition bg-slate-50 hover:bg-white">
            </div>
            <div class="col-span-2 sm:col-span-1">
                <label class="block text-sm font-bold text-slate-700 mb-1.5">Gender</label>
                <select name="gender" required class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition bg-slate-50 hover:bg-white">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="col-span-2 sm:col-span-1">
                <label class="block text-sm font-bold text-slate-700 mb-1.5">Class</label>
                <input type="text" name="class_name" required class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition bg-slate-50 hover:bg-white">
            </div>
            <div class="col-span-2 sm:col-span-1">
                <label class="block text-sm font-bold text-slate-700 mb-1.5">Phone</label>
                <input type="text" name="phone" required class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition bg-slate-50 hover:bg-white">
            </div>
            <div class="col-span-2 sm:col-span-1">
                <label class="block text-sm font-bold text-slate-700 mb-1.5">Email</label>
                <input type="email" name="email" required class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition bg-slate-50 hover:bg-white">
            </div>
            <div class="md:col-span-2">
                <label class="block text-sm font-bold text-slate-700 mb-1.5">Address</label>
                <textarea name="address" rows="3" required class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition bg-slate-50 hover:bg-white"></textarea>
            </div>
            <div class="col-span-2 sm:col-span-1">
                <label class="block text-sm font-bold text-slate-700 mb-1.5">Admission Date</label>
                <input type="date" name="admission_date" required class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition bg-slate-50 hover:bg-white">
            </div>
            <div class="flex items-end pt-2 col-span-2">
                <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 hover:scale-[1.02] hover-lift">Add Student</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
